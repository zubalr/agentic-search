[project]
name = "agentic-search"
version = "0.1.0"
description = "An agentic search project with autocomplete functionality."
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.24.4",
    "pandas>=2.0.3",
    "plotly>=6.2.0",
    "requests>=2.32.4",
    "streamlit>=1.40.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
