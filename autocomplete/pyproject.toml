[project]
name = "agentic-search"
version = "0.1.0"
description = "An agentic search project with autocomplete functionality."
requires-python = ">=3.8"
dependencies = [
    "requests>=2.32.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
